name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v6

      - name: نصب Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: بررسی Flutter
        run: flutter --version

      - name: دریافت وابستگی‌ها
        run: flutter pub get

      - name: بررسی کد
        run: flutter analyze

      - name: ساخت APK
        run: flutter build apk --release

      - name: ذخیره APK
        uses: actions/upload-artifact@v4
        with:
          name: tailor-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
